<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Portfolio Manager (referenced categories)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="loader" aria-hidden="true"><span>Loading</span><i></i></div>

<header class="hero">
  <img class="hero-bg" src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=2000&q=80" alt="" onerror="this.remove()" />
  <div class="hero-shade"></div>
  <div class="hero-inner">
    <span class="eyebrow reveal">&#9702; Portfolio manager</span>
    <h1 class="reveal">My Portfolio</h1>
    <p class="reveal">Add, edit and organize your work by category.</p>
  </div>
  <div class="strip" aria-hidden="true">
    <div class="strip-track">
      <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=600&q=70" alt="" onerror="this.style.visibility='hidden'" />
      <img src="https://images.unsplash.com/photo-1522542550221-31fd19575a2d?auto=format&fit=crop&w=600&q=70" alt="" onerror="this.style.visibility='hidden'" />
      <img src="https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=600&q=70" alt="" onerror="this.style.visibility='hidden'" />
      <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=600&q=70" alt="" onerror="this.style.visibility='hidden'" />
      <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=600&q=70" alt="" onerror="this.style.visibility='hidden'" />
      <img src="https://images.unsplash.com/photo-1522542550221-31fd19575a2d?auto=format&fit=crop&w=600&q=70" alt="" onerror="this.style.visibility='hidden'" />
      <img src="https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=600&q=70" alt="" onerror="this.style.visibility='hidden'" />
      <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=600&q=70" alt="" onerror="this.style.visibility='hidden'" />
    </div>
  </div>
</header>

<main>
  <section class="card reveal">
      <h2 id="form-title">Add a project</h2>
      <form id="project-form">
        <input type="hidden" id="project-id" />

        <label>Title
          <input type="text" id="title" required />
        </label>

        <label>Category
          <select id="category" required>
            <option value="">Choose a category...</option>
          </select>
        </label>

        <label>Year
          <input type="number" id="year" min="1990" max="2100" placeholder="2025" />
        </label>

        <label>Description
          <textarea id="description" rows="3"></textarea>
        </label>

        <label>Tags (comma separated)
          <input type="text" id="tags" placeholder="javascript, api" />
        </label>

        <label>Link
          <input type="url" id="link" placeholder="https://..." />
        </label>

        <label>Image URL (optional thumbnail)
          <input type="url" id="image" placeholder="https://.../picture.jpg" />
        </label>

        <label class="check">
          <input type="checkbox" id="featured" />
          Featured project
        </label>

        <div class="actions">
          <button type="submit">Save project</button>
          <button type="button" id="cancel-btn" hidden>Cancel</button>
        </div>
      </form>
  </section>

  <!-- Categories now sits between the project form and the search box -->
  <section class="card reveal" id="categories-card">
      <h2 id="cat-form-title">Add a category</h2>
      <form id="category-form">
        <input type="hidden" id="category-id" />

        <label>Name
          <input type="text" id="category-name" required />
        </label>

        <label>Color
          <input type="color" id="category-color" value="#f5a524" />
        </label>

        <label>Description
          <input type="text" id="category-description" placeholder="What goes in this category?" />
        </label>

        <div class="actions">
          <button type="submit">Save category</button>
          <button type="button" id="cat-cancel-btn" hidden>Cancel</button>
        </div>
        <p id="category-message" class="message" role="status"></p>
      </form>

      <ul id="category-list" class="category-list"></ul>
  </section>

  <section class="card reveal">
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search title or tags..." />
    </div>

    <div class="tools">
      <button type="button" id="export-btn" class="ghost">Export JSON</button>
      <button type="button" id="import-btn" class="ghost">Import JSON</button>
      <button type="button" id="clear-btn" class="danger">Clear all projects</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden />
    </div>

    <div id="tabs" class="tabs"></div>
    <p id="count"></p>
    <div id="project-list"></div>
  </section>
</main>

<script src="https://unpkg.com/dexie@4/dist/dexie.js"></script>
<script src="app.js"></script>
<script src="anim.js"></script>
</body>
</html>
