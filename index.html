<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Portfolio Manager (referenced categories)</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>My Portfolio</h1>
  <p>Exercise 8: categories live in their own collection and projects point to them by id.</p>
</header>

<main>
  <div class="column">
    <section class="card">
      <h2 id="form-title">Add a project</h2>
      <form id="project-form">
        <input type="hidden" id="project-id" />

        <label>Title
          <input type="text" id="title" required />
        </label>

        <label>Category
          <select id="category" required>
            <option value="">Choose a category...</option>
          </select>
        </label>

        <label>Year
          <input type="number" id="year" min="1990" max="2100" placeholder="2025" />
        </label>

        <label>Description
          <textarea id="description" rows="3"></textarea>
        </label>

        <label>Tags (comma separated)
          <input type="text" id="tags" placeholder="javascript, api" />
        </label>

        <label>Link
          <input type="url" id="link" placeholder="https://..." />
        </label>

        <label>Image URL (optional thumbnail)
          <input type="url" id="image" placeholder="https://.../picture.jpg" />
        </label>

        <label class="check">
          <input type="checkbox" id="featured" />
          Featured project
        </label>

        <div class="actions">
          <button type="submit">Save project</button>
          <button type="button" id="cancel-btn" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <!-- The new screen: add, rename and delete categories -->
    <section class="card" id="categories-card">
      <h2 id="cat-form-title">Add a category</h2>
      <form id="category-form">
        <input type="hidden" id="category-id" />

        <label>Name
          <input type="text" id="category-name" required />
        </label>

        <label>Color
          <input type="color" id="category-color" value="#f5a524" />
        </label>

        <label>Description
          <input type="text" id="category-description" placeholder="What goes in this category?" />
        </label>

        <div class="actions">
          <button type="submit">Save category</button>
          <button type="button" id="cat-cancel-btn" hidden>Cancel</button>
        </div>
        <p id="category-message" class="message" role="status"></p>
      </form>

      <ul id="category-list" class="category-list"></ul>
    </section>
  </div>

  <section class="card">
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search title or tags..." />
    </div>

    <div class="tools">
      <button type="button" id="export-btn" class="ghost">Export JSON</button>
      <button type="button" id="import-btn" class="ghost">Import JSON</button>
      <button type="button" id="clear-btn" class="danger">Clear all projects</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden />
    </div>

    <div id="tabs" class="tabs"></div>
    <p id="count"></p>
    <div id="project-list"></div>
  </section>
</main>

<script src="https://unpkg.com/dexie@4/dist/dexie.js"></script>
<script src="app.js"></script>
</body>
</html>
